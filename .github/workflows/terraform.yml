name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
    AWS_DEFAULT_REGION: us-east-1
    AWS_REGION: us-east-1
    EKS_CLUSTER: vprofile-eks

jobs:
  terraform:
    name: "Apply terraform code changes"
    runs-on: ubuntu-latest
    defaults: 
      run:
        shell: bash
        working-directory: ./terraform
        
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v4

      - name: "Setup Terraform"
        uses: hashicorp/setup-terraform@v2
       # with:
          #terraform_version: "1.6.3"

      - name: "Debug Environment Variables"
        shell: bash
        run: |
          echo "AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID"
          echo "AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY"
          echo "BUCKET_TF_STATE: $BUCKET_TF_STATE"
          echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
          echo "AWS_REGION: $AWS_REGION"
          echo "AWS_ACCESS_KEY_ID length: ${#AWS_ACCESS_KEY_ID}"
          echo "AWS_SECRET_ACCESS_KEY length: ${#AWS_SECRET_ACCESS_KEY}"
          echo "First 4 chars of ACCESS_KEY: ${AWS_ACCESS_KEY_ID:0:4}"
          echo "Last 4 chars of ACCESS_KEY: ${AWS_ACCESS_KEY_ID: -4}"
 
      - name: "Check AWS_ACCESS_KEY_ID"
        shell: bash
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "AWS_ACCESS_KEY_ID is empty or not set!"
            exit 1
          else
            echo "AWS_ACCESS_KEY_ID is set correctly."
          fi

      - name: "Test AWS Authentication"
        run: |
          echo "Testing AWS CLI version:"
          aws --version
          echo "Testing AWS configuration:"
          aws configure list
          echo "Testing basic STS call:"
          aws sts get-caller-identity

      - name: "Test AWS Region Access"
        run: |
          echo "Testing region-specific call:"
          aws ec2 describe-regions --region us-east-1 --output table || {
            echo "Region access test failed"
            exit 1
          }

      - name: "Terraform Init"
        id: init
        run: |
          echo "Initializing Terraform with backend bucket: ${BUCKET_TF_STATE}"
          terraform init -backend-config="bucket=${BUCKET_TF_STATE}" || {
            echo "Terraform init failed, checking S3 bucket access:"
            aws s3 ls s3://${BUCKET_TF_STATE} || echo "Cannot access S3 bucket"
            exit 1
          } 

      - name: "Terraform format check"
        id: fmt
        run: terraform fmt -check 
        
      - name: "Terraform Validate"
        id: validate
        run: terraform validate
    
      - name: "Terraform Plan"
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true

      - name: "Terraform Plan status"
        if: steps.plan.outcome == 'failure'
        run: exit 1

